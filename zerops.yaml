zerops:
  - setup: api
    build:
      base: bun@1.2
      envVariables:
        BUN_INSTALL: ./.bun
      buildCommands:
        - cd apps/api && bun install && bun run build
      deployFiles:
        - apps/api/dist/~
      cache:
        - apps/api/node_modules
        - .bun/install/cache
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: bun@1.2
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: "3000"
        DB_HOST: ${db_hostname}
        DB_PORT: ${db_port}
        DB_USER: ${db_user}
        DB_PASS: ${db_password}
        DB_NAME: ${db_dbName}
        REDIS_HOST: ${redis_hostname}
        REDIS_PORT: ${redis_port}
        REDIS_PASSWORD: ${redis_password}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        S3_PUBLIC_URL: ${storage_apiUrl}/${storage_bucketName}
        CORS_ORIGIN: "*"
        INTERNAL_SECRET: flare-zerops-challenge
      start: bun run index.js

  - setup: worker
    build:
      base: bun@1.2
      # Zerops omits node_modules from deploy artefacts; ship sources + install at boot
      buildCommands:
        - echo "worker sources only; deps install at runtime"
      deployFiles:
        - apps/worker/~
    run:
      base: bun@1.2
      envVariables:
        DB_HOST: ${db_hostname}
        DB_PORT: ${db_port}
        DB_USER: ${db_user}
        DB_PASS: ${db_password}
        DB_NAME: ${db_dbName}
        REDIS_HOST: ${redis_hostname}
        REDIS_PORT: ${redis_port}
        REDIS_PASSWORD: ${redis_password}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        API_INTERNAL_URL: http://api:3000
        INTERNAL_SECRET: flare-zerops-challenge
      start: bun install && bun run src/index.ts

  - setup: frontend
    build:
      base: bun@1.2
      envVariables:
        BUN_INSTALL: ./.bun
        VITE_API_URL: https://api-2b1c-3000.prg1.zerops.app
        VITE_WS_URL: wss://api-2b1c-3000.prg1.zerops.app/ws
      buildCommands:
        - cd apps/web && bun install && bun run build
      deployFiles:
        - apps/web/dist/~
      cache:
        - apps/web/node_modules
        - .bun/install/cache
    run:
      base: static
