services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: flare
      POSTGRES_DB: flare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flareflare
      MINIO_ROOT_PASSWORD: flareflare
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # External monitored demo application (not Flare)
  shopdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ["5433:5432"]
    volumes: [shoppgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
  miniodata:
  shoppgdata:
