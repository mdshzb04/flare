zerops:
  - setup: api
    build:
      base: bun@1.2
      envVariables:
        BUN_INSTALL: ./.bun
      buildCommands:
        - cd apps/api && bun install && bun run build
      deployFiles:
        - apps/api/dist/~
      cache:
        - apps/api/node_modules
        - .bun/install/cache
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: bun@1.2
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: "3000"
        DB_HOST: ${db_hostname}
        DB_PORT: ${db_port}
        DB_USER: ${db_user}
        DB_PASS: ${db_password}
        DB_NAME: ${db_dbName}
        REDIS_HOST: ${redis_hostname}
        REDIS_PORT: ${redis_port}
        REDIS_PASSWORD: ${redis_password}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        S3_PUBLIC_URL: ${storage_apiUrl}/${storage_bucketName}
        CORS_ORIGIN: "*"
        INTERNAL_SECRET: flare-zerops-challenge
        PUBLIC_APP_URL: https://frontend-2b1c.prg1.zerops.app
        SHOP_API_URL: http://shopapi:4000
        SHOP_HEALTH_URL: http://shopapi:4000/health
      start: bun run index.js

  - setup: worker
    build:
      base: bun@1.2
      # Zerops omits node_modules from deploy artefacts; ship sources + install at boot
      buildCommands:
        - echo "worker sources only; deps install at runtime"
      deployFiles:
        - apps/worker/~
    run:
      base: bun@1.2
      envVariables:
        DB_HOST: ${db_hostname}
        DB_PORT: ${db_port}
        DB_USER: ${db_user}
        DB_PASS: ${db_password}
        DB_NAME: ${db_dbName}
        REDIS_HOST: ${redis_hostname}
        REDIS_PORT: ${redis_port}
        REDIS_PASSWORD: ${redis_password}
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
        API_INTERNAL_URL: http://api:3000
        INTERNAL_SECRET: flare-zerops-challenge
        SHOP_API_URL: http://shopapi:4000
        SHOP_HEALTH_URL: http://shopapi:4000/health
      # Zerops wraps start with `exec`; use a script so install + long-run both happen
      start: sh ./start.sh

  - setup: frontend
    build:
      base: bun@1.2
      envVariables:
        BUN_INSTALL: ./.bun
        VITE_API_URL: https://api-2b1c-3000.prg1.zerops.app
        VITE_WS_URL: wss://api-2b1c-3000.prg1.zerops.app/ws
      buildCommands:
        - cd apps/web && bun install && bun run build
      deployFiles:
        - apps/web/dist/~
      cache:
        - apps/web/node_modules
        - .bun/install/cache
    run:
      base: static

  # --- Monitored demo application (external to Flare) ---
  - setup: shopapi
    build:
      base: bun@1.2
      buildCommands:
        - echo "shop-api sources; deps install at runtime"
      deployFiles:
        - apps/shop-api/~
    deploy:
      readinessCheck:
        httpGet:
          port: 4000
          path: /health
    run:
      base: bun@1.2
      ports:
        - port: 4000
          httpSupport: true
      envVariables:
        PORT: "4000"
        DB_HOST: ${shopdb_hostname}
        DB_PORT: ${shopdb_port}
        DB_USER: ${shopdb_user}
        DB_PASS: ${shopdb_password}
        DB_NAME: ${shopdb_dbName}
        FLARE_TELEMETRY_URL: http://api:3000/api/telemetry/events
        OTEL_SERVICE_NAME: shop-api
        OTEL_SERVICE_VERSION: "1.0.0"
        OTEL_EXPORTER_OTLP_ENDPOINT: http://api:3000
        OTEL_DEPLOYMENT_ENVIRONMENT: zerops
      start: sh ./start.sh

  - setup: shopworker
    build:
      base: bun@1.2
      buildCommands:
        - echo "shop-worker sources; deps install at runtime"
      deployFiles:
        - apps/shop-worker/~
    run:
      base: bun@1.2
      envVariables:
        SHOP_API_URL: http://shopapi:4000
        FLARE_TELEMETRY_URL: http://api:3000/api/telemetry/events
      start: sh ./start.sh
